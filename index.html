<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Convertor</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>

  </head>

  <body class="flex flex-col justify-center items-center min-h-screen bg-cover bg-center bg-no-repeat bg-black bg-gradient-to-br from-gray-900 to-gray-700">
    <h1 class="text-4xl font-bold text-white text-center shadow-lg">Currency Converter</h1>
    <div class="container bg-white bg-opacity-10 p-6 rounded-lg shadow-lg w-full max-w-md mt-6">
      <form action="" class="space-y-4">
        <div class="amount text-center">
          <p class="text-xl font-semibold text-white">Enter Amount</p>
          <input type="text" value="1" class="w-full p-3 rounded-lg text-gray-900">
        </div>
        <div class="dropdown flex justify-between items-center mt-4 font-semibold">
          <div class="from">
            <p class="text-white">From</p>
            <div class="select-container flex items-center gap-2 p-2 bg-white rounded-md shadow">
              <img src="https://flagsapi.com/US/flat/64.png" alt="" />
              <select name="from" class="bg-transparent border-none text-gray-900 outline-none"></select>
            </div>
          </div>
          <i class="bx bx-right-arrow-alt text-3xl text-white"></i>
          <div class="to">
            <p class="text-white">To</p>
            <div class="select-container flex items-center gap-2 p-2 bg-white rounded-md shadow">
              <img src="https://flagsapi.com/IN/flat/64.png" alt="" />
              <select name="to" class="bg-transparent border-none text-gray-900 outline-none"></select>
            </div>
          </div>
        </div>
        <div class="msg text-center text-lg text-white font-bold">1 USD = 83 INR</div>
        <div class="btn-cont flex justify-center">
          <button class="px-6 py-3 rounded-lg bg-gray-400 text-lg text-white font-bold transform transition-all duration-300 hover:scale-110">Get Exchange Rate</button>
        </div>
      </form>
    </div>
    <script src="./code.js"></script>
    <script src="./app.js"></script>
  </body>
  
</html>
